<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/dacate.svg" />
  <link rel="apple-touch-icon" href="/icons/dacate-180x180.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dacate: organiza tus tareas, exámenes, horarios y recordatorios académicos en un solo lugar." />
  <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16171d" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dacate" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:;" />
  <title>Decate - Organiza tus tareas académicas</title>
  <script>
    // El tema vive en IndexedDB: se aplica antes del primer pintado para evitar el flash.
    (function () {
      try {
        var request = indexedDB.open("dacate", 1);
        request.onupgradeneeded = function () {
          if (!request.result.objectStoreNames.contains("kv")) {
            request.result.createObjectStore("kv");
          }
        };
        request.onsuccess = function () {
          var get = request.result.transaction("kv", "readonly").objectStore("kv").get("dacate-theme");
          get.onsuccess = function () {
            var mode = get.result === "dark" || get.result === "light" || get.result === "system" ? get.result : "light";
            var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            var root = document.documentElement;
            root.classList.toggle("dark", dark);
            root.dataset.theme = dark ? "dark" : "light";
          };
        };
      } catch (e) {
        /* noop: la app aplica el tema una vez React monta */
      }
    })();
  </script>
  <style>
    :root {
      --shell-bg: #fbfaf9;
      --shell-border: #e8e6e3;
      --shell-bar: #eae8e4;
      --shell-card: #f4f3f0;
    }
    :root.dark, [data-theme="dark"] {
      --shell-bg: #16171d;
      --shell-border: #262833;
      --shell-bar: #232530;
      --shell-card: #1c1d25;
    }
    @media (min-width: 768px) {
      .shell-sidebar { display: block !important; }
    }
    @keyframes shell-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }
    .shell-pulse { animation: shell-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>

<body>
  <div id="root">
    <div class="shell-pulse" style="display:flex;min-height:100vh;background-color:var(--shell-bg);font-family:system-ui,-apple-system,sans-serif;">
      <div class="shell-sidebar" style="width:250px;border-right:1px solid var(--shell-border);padding:1.5rem 1rem;display:none;flex-shrink:0;">
        <div style="height:28px;width:110px;background:var(--shell-bar);border-radius:6px;margin-bottom:2rem;"></div>
        <div style="height:20px;background:var(--shell-bar);border-radius:4px;margin-bottom:1rem;width:80%;"></div>
        <div style="height:20px;background:var(--shell-bar);border-radius:4px;margin-bottom:1rem;width:70%;"></div>
        <div style="height:20px;background:var(--shell-bar);border-radius:4px;margin-bottom:1rem;width:75%;"></div>
      </div>
      <div style="flex:1;padding:2rem 1.5rem;">
        <div style="max-width:1024px;margin:0 auto;">
          <div style="height:14px;width:130px;background:var(--shell-bar);border-radius:4px;margin-bottom:0.75rem;"></div>
          <div style="height:32px;width:280px;background:var(--shell-bar);border-radius:6px;margin-bottom:1rem;"></div>
          <div style="height:18px;width:220px;background:var(--shell-bar);border-radius:4px;margin-bottom:2rem;"></div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:1rem;">
            <div style="height:140px;background:var(--shell-card);border-radius:8px;border:1px solid var(--shell-border);"></div>
            <div style="height:140px;background:var(--shell-card);border-radius:8px;border:1px solid var(--shell-border);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
