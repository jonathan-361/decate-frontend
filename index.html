<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/dacate.svg" />
  <link rel="apple-touch-icon" href="/icons/dacate-180x180.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Dacate: organiza tus tareas, exámenes, horarios y recordatorios académicos en un solo lugar." />
  <meta name="theme-color" content="#fbfaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#16171d" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dacate" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:;" />
  <title>Decate - Organiza tus tareas académicas</title>
  <script>
    // El tema vive en IndexedDB: se aplica antes del primer pintado para evitar el flash.
    (function () {
      try {
        var request = indexedDB.open("dacate", 1);
        request.onupgradeneeded = function () {
          if (!request.result.objectStoreNames.contains("kv")) {
            request.result.createObjectStore("kv");
          }
        };
        request.onsuccess = function () {
          var get = request.result.transaction("kv", "readonly").objectStore("kv").get("dacate-theme");
          get.onsuccess = function () {
            var mode = get.result === "dark" || get.result === "light" || get.result === "system" ? get.result : "light";
            var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            var root = document.documentElement;
            root.classList.toggle("dark", dark);
            root.dataset.theme = dark ? "dark" : "light";
          };
        };
      } catch (e) {
        /* noop: la app aplica el tema una vez React monta */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
